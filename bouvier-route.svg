<g fill="#913b35" stroke="#fff8ea" stroke-width="4">
<circle cx="196" cy="164" r="8"/><circle cx="363" cy="185" r="6.5"/><circle cx="469" cy="232" r="8"/><circle cx="678" cy="268" r="7"/><circle cx="740" cy="298" r="7"/><circle cx="990" cy="322" r="8.5"/>
