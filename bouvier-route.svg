<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
<title id="title">The Way of the World: Geneva to the Khyber Pass, 1953–1954</title>
<desc id="description">Illustrated eastward route through Yugoslavia, Turkey and Iran towards the Khyber Pass. A schematic map inspired by historical travel atlases; not a precise road itinerary.</desc>
<defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f6ead4"/><stop offset=".55" stop-color="#e9d8bb"/><stop offset="1" stop-color="#e0cda8"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#8ba7aa"/><stop offset="1" stop-color="#bfd0c7"/></linearGradient>
 <radialGradient id="vignette"><stop offset=".63" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#785e3d" stop-opacity=".13"/></radialGradient>
 <filter id="paperNoise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="7" stitchTiles="stitch" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="grey"/><feComponentTransfer in="grey"><feFuncA type="linear" slope=".13"/></feComponentTransfer></filter>
 <pattern id="grid" width="78" height="50" patternUnits="userSpaceOnUse"><path d="M 78 0 L 0 0 0 50" stroke="#9f967d" stroke-width=".6" opacity=".27" fill="none"/></pattern>
 <pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse"><path d="M 0 11 L 11 0" stroke="#84745c" stroke-width=".6" opacity=".18"/></pattern>
 <filter id="soften"><feGaussianBlur stdDeviation="2.7"/></filter>
</defs>
<rect width="1200" height="520" fill="url(#paper)"/>
<rect width="1200" height="520" fill="url(#grid)"/>
