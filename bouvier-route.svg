<path d="M740 204C766 171 804 163 833 186C863 219 861 273 843 312C830 342 813 360 792 353C773 320 762 286 758 250Z" fill="#9bb4b5" opacity=".9"/>
<path d="M747 461Q770 429 794 428L825 460L848 520H745Z" fill="#a1bbba" opacity=".8"/>
<!-- Southern mountains; translucent watercolour shadow and crags. -->
<path d="M602 376L668 345L705 372L745 352L791 387L844 363L902 395L966 350L1023 390L1095 342L1180 365L1200 460L600 470Z" fill="#b3a88b" opacity=".31" filter="url(#soften)"/>
