<g font-family="Georgia,serif" fill="#544134"><text x="37" y="32" font-size="23" letter-spacing="3">THE JOURNEY EAST</text><text x="36" y="57" font-size="14" letter-spacing="2">GENEVA TO THE KHYBER PASS · 1953–1954</text></g>
<rect x="25" y="456" width="450" height="45" rx="1" fill="#faf0dc" opacity=".78"/>
