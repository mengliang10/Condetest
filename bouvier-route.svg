<rect x="11" y="11" width="1178" height="498" fill="none" stroke="#ab9073" stroke-width="1.2"/>
<rect width="1200" height="520" fill="url(#vignette)"/>
<rect width="1200" height="520" filter="url(#paperNoise)"/>
<g fill="#6c5d4c" font-family="Georgia,serif" font-size="20" font-style="italic" letter-spacing="2" opacity=".68">
<text x="216" y="106">EUROPE</text><text x="732" y="95">ASIA</text><text x="225" y="429">Mediterranean Sea</text><text x="493" y="274">Black Sea</text><text x="766" y="279" transform="rotate(90 766 279)">Caspian Sea</text><text x="1050" y="451">Hindu Kush</text></g>
