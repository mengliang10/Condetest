name: Publish CondeTest website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF renderer
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build downloadable magazine
        run: npm run build:pdf
      - name: Stage site files
        # Publish only what the site needs. Without this step the whole repository,
        # including node_modules from the PDF renderer, would be uploaded to Pages.
        run: |
          mkdir -p _site
          cp *.html styles.css bouvier.css i18n.js bouvier.js print.js ui.js _site/
          if [ -d assets ]; then cp -r assets _site/; fi
          cp -r lang _site/
          cp magazine*.pdf bouvier*.pdf _site/
          ls -la _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
